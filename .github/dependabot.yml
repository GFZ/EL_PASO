version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "cron"
      cronjob: "0 8 * * 1"
      timezone: "Europe/Berlin"

updates:
  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns:
      - "*"
    cooldown:
      default-days: 0
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "uv"
    directory: "/"
    patterns:
      - "*"
    cooldown:
      default-days: 0
    multi-ecosystem-group: "dependencies"
