version: 2

updates:
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 8 * * 1"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 0
    groups:
      pre-commit-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 8 * * 1"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 0
    groups:
      uv-dependencies:
        patterns:
          - "*"
