name: Build and Push Apptainer Image

on:
  push:
    branches: [main]
    paths:
      - "*.def"
      - "el_paso/**"
      - "pyproject.toml"
      - "scripts/**"
      - ".github/workflows/apptainer.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.def"
      - "el_paso/**"
      - "pyproject.toml"
      - "scripts/**"
      - ".github/workflows/apptainer.yml"
  workflow_dispatch:

env:
  APPTAINER_VERSION: "1.5.3"
  IMAGE_NAME: el_paso

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Get EL-PASO package version
        id: elpaso_version
        run: |
          VERSION=$(grep -oP '(?<=^current_version = ")[^"]+' pyproject.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Apptainer .deb
        id: cache-apptainer-deb
        uses: actions/cache@v6
        with:
          path: apptainer_${{ env.APPTAINER_VERSION }}_amd64.deb
          key: apptainer-deb-${{ env.APPTAINER_VERSION }}

      - name: Download Apptainer
        if: steps.cache-apptainer-deb.outputs.cache-hit != 'true'
        run: wget https://github.com/apptainer/apptainer/releases/download/v${{ env.APPTAINER_VERSION }}/apptainer_${{ env.APPTAINER_VERSION }}_amd64.deb

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y ./apptainer_${{ env.APPTAINER_VERSION }}_amd64.deb

      - name: Build image
        run: sudo apptainer build ${{ env.IMAGE_NAME }}.sif el_paso.def

      - name: Check libirbem.so is present in image
        run: |
          sudo apptainer exec ${{ env.IMAGE_NAME }}.sif test -f /opt/el_paso/el_paso/libirbem.so  && echo "libirbem.so found" || { echo "libirbem.so NOT found" >&2; exit 1; }

      - name: Test import in image
        run: |
          sudo apptainer exec --no-mount cwd ${{ env.IMAGE_NAME }}.sif python -c "import el_paso; print('Import successful',  el_paso.__file__)"

      - name: Get zenodo record ID
        id: zenodo-record
        run: echo "id=$(grep -oP 'RECORD_ID="\K[^"]+' download_data_for_tests.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache test data
        id: cache-test-data
        uses: actions/cache@v6
        with:
          path: tests/system/data
          key: zenodo-test-data-${{ steps.zenodo-record.outputs.id }}

      - name: Download test data from zenodo
        if: steps.cache-test-data.outputs.cache-hit != 'true'
        run: bash download_data_for_tests.sh

      - name: Run full test suite in image
        env:
          ESA_CLIENT_ID: ${{ secrets.ESA_CLIENT_ID }}
          ESA_CLIENT_SECRET: ${{ secrets.ESA_CLIENT_SECRET }}
        run: |
          sudo --preserve-env=ESA_CLIENT_ID,ESA_CLIENT_SECRET apptainer exec --no-mount cwd \
            --bind "${PWD}/tests:/mnt/tests" \
            --bind "${PWD}/pytest.ini:/mnt/pytest.ini" \
            --pwd /mnt \
            --env "ESA_CLIENT_ID=${ESA_CLIENT_ID},ESA_CLIENT_SECRET=${ESA_CLIENT_SECRET},_TYPER_FORCE_DISABLE_TERMINAL=1" \
            ${{ env.IMAGE_NAME }}.sif python -m pytest -rf /mnt/tests -m "basic" -c /mnt/pytest.ini --ignore /mnt/tests/unittests/test_release_mode.py

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.repository_owner == 'GFZ'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | apptainer remote login -u ${{ github.actor }} --password-stdin oras://ghcr.io

      - name: Set lowercase repository owner
        if: github.event_name == 'push' && github.repository_owner == 'GFZ'
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT" #{,,} works in bash to make it lowecase
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Push image
        if: github.event_name == 'push' && github.repository_owner == 'GFZ'
        run: |
          apptainer push ${{ env.IMAGE_NAME }}.sif oras://ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
          apptainer push ${{ env.IMAGE_NAME }}.sif oras://ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          apptainer push ${{ env.IMAGE_NAME }}.sif oras://ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.elpaso_version.outputs.version }}
