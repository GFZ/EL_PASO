name: Full tests (/run-full-tests)

on:
  repository_dispatch:
    types: [run-full-tests-command]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.event.client_payload.pull_request.head.sha }}
    secrets: inherit

  report:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post result to the PR head commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.client_payload.pull_request.head.sha }}
          RESULT: ${{ needs.tests.result }}
        run: |
          if [ "$RESULT" = "success" ]; then state=success; else state=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="full-tests (/run-full-tests)" \
            -f description="Basic tests: $RESULT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
