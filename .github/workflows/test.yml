name: EL_PASO Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install .
          pip install coveralls coverage pytest-cov

      - name: Get zenodo record ID
        id: zenodo-record
        run: echo "id=$(grep -oP 'RECORD_ID="\K[^"]+' download_data_for_tests.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache test data
        id: cache-test-data
        uses: actions/cache@v6
        with:
          path: tests/system/data
          key: zenodo-test-data-${{ steps.zenodo-record.outputs.id }}

      - name: Download test data from zenodo
        if: steps.cache-test-data.outputs.cache-hit != 'true'
        run: bash download_data_for_tests.sh

      - name: Run tests
        env:
          ESA_CLIENT_ID: ${{ secrets.ESA_CLIENT_ID }}
          ESA_CLIENT_SECRET: ${{ secrets.ESA_CLIENT_SECRET }}
        run: python -m coverage run --source el_paso -m pytest -rf tests -m basic --indices_sw_param_data_path tests/system/data/indices_sw_params

      - name: Run Coveralls
        if: ${{ success() && matrix.python-version == '3.12' }}
        run: |
          coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
