name: EL_PASO Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@main
        with:
          version: "latest"
          src: el_paso

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@main
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install project and ty
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run ty
        run: ty check

  tests:
    needs: [ruff, ty]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync
          uv pip install coveralls coverage pytest-cov

      - name: Get zenodo record ID
        id: zenodo-record
        run: echo "id=$(grep -oP 'RECORD_ID="\K[^"]+' download_data_for_tests.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache test data
        id: cache-test-data
        uses: actions/cache@v6
        with:
          path: tests/system/data
          key: zenodo-test-data-${{ steps.zenodo-record.outputs.id }}

      - name: Download test data from zenodo
        if: steps.cache-test-data.outputs.cache-hit != 'true'
        run: bash download_data_for_tests.sh

      - name: Run tests
        env:
          ESA_CLIENT_ID: ${{ secrets.ESA_CLIENT_ID }}
          ESA_CLIENT_SECRET: ${{ secrets.ESA_CLIENT_SECRET }}
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: uv run coverage run --source el_paso -m pytest -rf tests -m basic --indices_sw_param_data_path tests/system/data/indices_sw_params

      - name: Run Coveralls
        if: ${{ success() && matrix.python-version == '3.12' }}
        run: |
          uv run coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
