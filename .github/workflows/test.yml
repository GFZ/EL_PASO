name: EL_PASO Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-basic-tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@main
        with:
          version: "latest"
          src: el_paso

  ty:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-basic-tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@main
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project and ty
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run ty
        run: ty check

  tests:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-basic-tests'
    needs: [ruff, ty]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync
          uv pip install coveralls coverage pytest-cov

      - name: Get test data revision
        id: test-data-revision
        run: echo "id=$(grep -oP 'REVISION="\K[^"]+' download_data_for_tests.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache test data
        id: cache-test-data
        uses: actions/cache@v6
        with:
          path: tests/system/data
          key: hf-test-data-${{ steps.test-data-revision.outputs.id }}

      - name: Download test data from Hugging Face
        if: steps.cache-test-data.outputs.cache-hit != 'true'
        run: bash download_data_for_tests.sh

      - name: Run tests
        env:
          ESA_CLIENT_ID: ${{ secrets.ESA_CLIENT_ID }}
          ESA_CLIENT_SECRET: ${{ secrets.ESA_CLIENT_SECRET }}
          GSSC_USER: ${{ secrets.GSSC_USER }}
          GSSC_PASS: ${{ secrets.GSSC_PASSWORD }}
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          EL_PASO_SKIP_DOWNLOAD: "1"
          # Pull requests run only the minimal tests, except the run started by adding the run-basic-tests label.
          # Everything else (push to main, manual dispatch) runs the basic tests.
          MARKER: ${{ github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name == 'run-basic-tests') && 'minimal' || 'basic' }}
        run: uv run coverage run --source el_paso -m pytest -rf tests -m "$MARKER" --indices_sw_param_data_path tests/system/data/indices_sw_params

      - name: Run Coveralls
        if: ${{ success() && matrix.python-version == '3.12' }}
        run: |
          uv run coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
