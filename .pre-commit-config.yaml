# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.13
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        files: ^el_paso/
      - id: ruff-format
        types_or: [python, pyi]
        files: ^el_paso/

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.80
    hooks:
      - id: ty
        files: ^el_paso/

  - repo: local
    hooks:
      - id: generate-metadata-stubs
        name: generate-metadata-stubs
        entry: python hooks/generate_metadata_stubs.py
        language: system
        pass_filenames: false
        files: ^(el_paso/data_standards/(gfz_standard|prbem_standard)\.py|scripts/generate_metadata_stubs\.py)$
      - id: check-recipe-strategies
        name: check-recipe-strategies
        entry: python hooks/check_recipe_strategies.py
        language: system
        pass_filenames: false
        files: ^el_paso/recipes/
  - repo: https://github.com/sahiljhawar/reuseify
    rev: 1.0.2
    hooks:
      - id: reuseify-lint
