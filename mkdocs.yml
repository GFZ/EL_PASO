site_name: ELaborative Particle Analysis from Particle Observations (EL PASO)
site_url: https://example.com
site_author: Bernhard Haas, Mátyás Szabó-Roberts

theme:
  name: material
  repo_url: https://github.com/GFZ/EL_PASO
  features:
    - navigation.instant
    - naviagation.indexes
    - navigation.tabs
    - math
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode

