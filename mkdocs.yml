markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true # Enable support for block and inline math

plugins:
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_root_heading: true
            show_signature: false
            signature_crossrefs: true
            merge_init_into_class: false
            separate_signature: true
            show_category_heading: true
            show_root_members_full_path: true
            show_signature_annotations: true
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.astropy.org/en/stable/objects.inv

  - search
  - mkdocs-jupyter:
      include:
        - "tutorials/*.ipynb"
      ignore:
        - "**/*.md"
      execute: true # run the notebook on build
      include_source: false # optionally include source or not
      allow_errors: true # fail build if execution errors

# - to-pdf:
#     output_path: docs/el_paso_documentation.pdf
#     toc_level: 3

extra_javascript:
  # Use MathJax for rendering latex equations
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
