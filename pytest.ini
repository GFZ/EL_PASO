[pytest]
pythonpath = .
log_cli = 1
log_cli_level = INFO
markers =
    minimal: minimal tests for a quick sanity check
    basic: basic tests for verification of the code
    network: tests which download real data from external servers; excluded from the minimal and basic runs
    visual: tests which produce visual output and have to be checked manually

testpaths =
    tests/unittests/dataset/*.py
    tests/unittests/saving_strategies/*.py
    tests/unittests/data_standards/*.py
    tests/unittests/processing/*.py
    tests/unittests/*.py

addopts = --import-mode=importlib --basetemp=/tmp/pytest
