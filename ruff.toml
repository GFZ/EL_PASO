line-length = 120

[lint]
select = ["ALL"]
ignore = [
    "D100",    # undocumented-public-module
    "D104",    # undocumented-public-package
    "G004",    # logging-f-string
    "PLR0913", # too-many-arguments
    "UP017",   # datetime-timezone-undocumented
    "COM812",  # disable trailing whitespace because we use formatter
    "S101",    # allow assert statements
    "RET504",  # allow assignment before return
    "UP045",
    "PLW",
    "D102",
    "N806",
    "N803",
    "SLF001",
    "C901",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "D105",
    "N802",
    "N999",
    "F401",
    "PLR0917",
    "CPY001",
    "UP046",
    "UP040",
    "UP047",
]
exclude = ["*.ipynb", "setup.py"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/*" = ["D103", "INP001", "ANN201", "N806"]
